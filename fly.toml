# NexCYR on Fly.io.
#
# A mounted volume is REQUIRED: the SQLite database and generated PDF reports
# live under /data, and Fly's root filesystem is wiped on every deploy.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create nexcyr_data --size 1 --region lhr
#   fly secrets set DATABASE_URL="sqlite:////data/nexcyr.db" REPORTS_DIR="/data/reports"
#   fly deploy

app = "nexcyr"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Non-secret defaults only. Real credentials (OPENAI_API_KEY etc.) go in
  # `fly secrets set ...` and are never written into this file.
  DATABASE_URL = "sqlite:////data/nexcyr.db"
  REPORTS_DIR = "/data/reports"

[[mounts]]
  source = "nexcyr_data"
  destination = "/data"
  auto_extend_size_threshold = 80

[http_service]
  internal_port = 8000
  force_https = true
  # Keep the machine warm: a cold start during a live demo looks like an outage,
  # and enrolled agents poll /api/agents/me/jobs/next on a short interval.
  auto_stop_machines = false
  auto_start_machines = true
  # Exactly one machine: a mounted volume is single-writer, and SQLite serializes
  # writes. Scale out only after switching DATABASE_URL to Postgres.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

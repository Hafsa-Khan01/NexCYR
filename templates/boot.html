<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexCYR</title>
  <link rel="stylesheet" href="/static/css/boot.css?v=20261008-boot4" />
</head>
<body>
  <main class="boot" id="boot" aria-label="NexCYR welcome screen">
    <div class="boot-earth" aria-hidden="true"></div>
    <div class="boot-symbol" aria-hidden="true">
      <svg viewBox="0 0 120 120" role="presentation">
        <defs>
          <linearGradient id="nxg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22e0ff"/>
            <stop offset="48%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#e11d8f"/>
          </linearGradient>
        </defs>
        <path d="M60 8 L101 31 L101 89 L60 112 L19 89 L19 31 Z"
              fill="rgba(0,0,0,.62)"
              stroke="url(#nxg)"
              stroke-width="3"/>
        <path d="M39 82 V38 L81 82 V38"
              fill="none"
              stroke="url(#nxg)"
              stroke-width="7"
              stroke-linecap="round"
              stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Welcome To NexCYR</h1>
  </main>

  <script>
    const boot = document.getElementById("boot");
    let done = false;

    function enterPlatform() {
      if (done) return;
      done = true;
      boot.classList.add("fade");
      window.setTimeout(() => {
        window.location.href = "/dashboard?from_boot=1";
      }, 480);
    }

    boot.addEventListener("click", enterPlatform);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        enterPlatform();
      }
    });
  </script>
</body>
</html>

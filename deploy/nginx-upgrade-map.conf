# WebSocket/upgrade map for the NexCYR proxy.
# This must live in the http{} context, so it is installed separately from the
# server block:
#   sudo cp deploy/nginx-upgrade-map.conf /etc/nginx/conf.d/nexcyr-upgrade-map.conf
#
# Without it, nginx refuses to start with "unknown variable connection_upgrade".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

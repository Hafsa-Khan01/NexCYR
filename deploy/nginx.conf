# NexCYR reverse proxy (nginx).
#
# Replace every occurrence of nexcyr.example.com with your real hostname, then:
#   sudo cp deploy/nginx-upgrade-map.conf /etc/nginx/conf.d/nexcyr-upgrade-map.conf
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/nexcyr
#   sudo ln -s /etc/nginx/sites-available/nexcyr /etc/nginx/sites-enabled/nexcyr
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nexcyr.example.com
#
# The conf.d map file is not optional: this config references $connection_upgrade.
#
# TLS is mandatory for the hybrid Cloud+Agent architecture: enrollment tokens and
# agent credentials are bearer tokens, and sending them over plain HTTP would
# expose them to anyone on the path.

# --- HTTP: redirect everything to HTTPS (certbot needs this block to exist) ---
server {
    listen 80;
    listen [::]:80;
    server_name nexcyr.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: proxy to the loopback-only uvicorn worker ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nexcyr.example.com;

    ssl_certificate     /etc/letsencrypt/live/nexcyr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexcyr.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Report PDFs and scan payloads stay well under this.
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Agent job polling and any future streaming endpoints.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long enough for a service-enumeration scan to finish without the proxy
        # cutting the request off mid-run.
        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # Never cache assessment data or scan results.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
}
